name: Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: Node.js準備
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 実行
        run: node index.js
